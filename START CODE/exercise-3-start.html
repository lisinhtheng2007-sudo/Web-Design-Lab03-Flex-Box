<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 3 Layout</title>
    <link rel="stylesheet" href="style.css"/>
    <style>
        .container{
            color: white;
            display: flex;
            flex-direction: column;
            gap: 1em;
        }
        header,
        main,
        .sidebar,
        footer,
        .item-card {
            border-radius: 0.5em;
        }
        header{
            background-color: #1e90ff; 
            padding: 1.3em;
        }
        .box{
            display: flex;
            gap:1em;
        }
        main {
            background-color: #3cb371;
            display: flex;
            flex-direction: column;
            gap: 1em;
            padding: 1em;
            flex-grow: 1;
        }
        .item{
            display: flex;
            flex-wrap: wrap;
            gap: 1em;
        }
        .item-card {
            display: flex;
            background-color: #2f8d59;
            padding: 1em;
        }
        .sidebar{
            text-align: center;
            background-color: #ff6347;
            display: flex;
            flex-direction: column; 
            padding: 1em;
        }
        footer{
            background-color: #4169e1;
            padding: 1.3em;
        }
    </style>
  </head>
  <body>
    <div class="container">
    <header class="header">header</header>

    <div class="box">
        <main class="main">
            <div>main</div>
            <div class="item">
                <div class="item-card">item</div>
                <div class="item-card">item</div>
                <div class="item-card">item</div>
                <div class="item-card">item</div>
                <div class="item-card">item</div>
                <div class="item-card">item</div>
                <div class="item-card">item</div>
                <div class="item-card">item</div>
                <div class="item-card">item</div>
                <div class="item-card">item</div>
                <div class="item-card">item</div>
            </div>
        </main>
        <div class="sidebar">sidebar</div>
    </div>
    <footer class="footer">footer</footer>
    </div>
  </body>
</html>
